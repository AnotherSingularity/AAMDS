[package]
name         = "aeon-operator-api"
version      = { workspace = true }
edition      = { workspace = true }
license      = { workspace = true }
publish      = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "aeon-operator-api"
path = "src/main.rs"

[dependencies]
aeon-contracts       = { path = "../contracts" }
aeon-core-runtime    = { path = "../core-runtime" }
aeon-track-management = { path = "../track-management" }
aeon-secure-relay    = { path = "../secure-relay" }
aeon-persistence     = { path = "../persistence" }
anyhow      = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
thiserror   = { workspace = true }
time        = { workspace = true }
uuid        = { workspace = true }
tokio       = { workspace = true }
axum        = { workspace = true }
hyper       = { workspace = true }
tracing     = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile    = { workspace = true }
tower       = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
